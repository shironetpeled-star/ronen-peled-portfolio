name: Enlarge name and professions
on:
  push:
    paths:
      - '.github/workflows/enlarge-brand-and-professions.yml'
permissions:
  contents: write
jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase brand and profession text sizes
        run: |
          cat >> assets/style.css <<'EOF'

/* Improve name and profession readability */
.brand b{font-size:18px;font-weight:900}
.brand small{font-size:12px;line-height:1.3;font-weight:700}
html[lang="he"] .brand small::after{font-size:12px;line-height:1.3;font-weight:700}
@media(max-width:950px){
  .brand b{font-size:19px}
  .brand small{font-size:12.5px;line-height:1.35}
  html[lang="he"] .brand small::after{font-size:12.5px;line-height:1.35}
}
EOF
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git commit -m "Increase name and profession text readability" || exit 0
          git push
