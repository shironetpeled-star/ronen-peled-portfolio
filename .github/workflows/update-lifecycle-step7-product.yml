name: Update lifecycle step 7 product and feature
on:
  push:
    paths:
      - '.github/workflows/update-lifecycle-step7-product.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update step 7 wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("<h3>מכירת פיצ'ר</h3><small>Feature Sales</small>", "<h3>מכירת מוצר / פיצ'ר</h3><small>Product / Feature Sales</small>")
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update lifecycle step 7 to product and feature sales" || exit 0
          git push
