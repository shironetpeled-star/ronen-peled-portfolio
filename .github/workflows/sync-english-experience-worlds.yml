name: Sync English experience business domains
on:
  push:
    paths:
      - '.github/workflows/sync-english-experience-worlds.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add business domains section to English experience
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('history-en.html')
          s = p.read_text(encoding='utf-8')
          marker = 'english-experience-worlds-v1'
          if marker in s:
              raise SystemExit(0)
          css = '''<style id="english-experience-worlds-v1">
.domainsSection{position:relative;isolation:isolate;margin-top:36px;padding:58px 46px 48px;border-radius:28px;overflow:hidden;background:linear-gradient(rgba(247,252,255,.88),rgba(255,255,255,.94)),url("assets/images/experience-worlds-bg.svg") center/cover no-repeat;border:1px solid #d9e9f7;box-shadow:0 22px 60px rgba(13,54,92,.10)}
.domainsSection:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(40,168,225,.14),transparent 30%),radial-gradient(circle at 18% 78%,rgba(25,94,216,.10),transparent 28%);z-index:-1;pointer-events:none}
.domainsTitle{text-align:center;max-width:850px;margin:0 auto 34px}.domainsTitle span{font-size:13px;font-weight:800;letter-spacing:.12em;color:#1684c5}.domainsTitle h2{font-size:clamp(2.2rem,4vw,3.4rem);color:#10284a;margin:10px 0 12px}.domainsTitle h2:after{content:"";display:block;width:78px;height:4px;border-radius:999px;background:#1ba9df;margin:18px auto 0}.domainsTitle p{font-size:1.08rem;line-height:1.8;color:#4f6073}
.domainsGrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px;align-items:stretch}.domainCard{grid-column:span 2;position:relative;background:rgba(255,255,255,.93);border:1px solid rgba(190,211,229,.9);border-radius:20px;padding:24px 18px;box-shadow:0 14px 34px rgba(12,48,80,.10);backdrop-filter:blur(4px);transition:transform .22s ease,box-shadow .22s ease}.domainCard:nth-child(5){grid-column:2 / span 2}.domainCard:hover{transform:translateY(-5px);box-shadow:0 20px 42px rgba(12,48,80,.15)}.domainCard h3{display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;gap:12px;color:#123b78;font-size:1.16rem;margin:0 0 12px}.domainIcon{width:58px;height:58px;border-radius:50%;display:inline-grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#eef7ff,#dfeaf7);border:1px solid #d1e2f0}.domainCard ul{font-size:.94rem;line-height:1.75;color:#34485e;padding-left:18px;margin:0}
@media(max-width:1180px){.domainsGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.domainCard,.domainCard:nth-child(5){grid-column:auto}}@media(max-width:760px){.domainsSection{padding:38px 18px}.domainsGrid{grid-template-columns:1fr}.domainsTitle h2{font-size:2.2rem}}
</style>'''
          section = '''<section class="page section domainsSection"><div class="domainsTitle"><span>BUSINESS DOMAINS</span><h2>The worlds I bring</h2><p>Accumulated experience across systems, customers and business processes in a wide range of industries.</p></div><div class="domainsGrid">
<article class="domainCard"><h3><span class="domainIcon">🛡️</span>Service, Security & Operations</h3><ul><li>Security and cleaning services</li><li>Emergency and distress-button services</li><li>Customer service centers</li><li>Service-package management</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">👥</span>Workforce & HR</h3><ul><li>Attendance and workforce management</li><li>Employee scheduling and placement</li><li>Payroll preparation processes</li><li>Operational HR workflows</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">💳</span>Retail, POS & Finance</h3><ul><li>Computerized cash registers and POS</li><li>Accounting systems</li><li>Pricing and price lists</li><li>Retail back-office systems</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">🚗</span>Automotive & Fleet</h3><ul><li>Vehicle rental and leasing</li><li>Vehicle sales</li><li>Repair-lot operations</li><li>Fleet and operational processes</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">🎬</span>Tourism, Leisure & Entertainment</h3><ul><li>Tourism and vacation businesses</li><li>Recreation and leisure systems</li><li>24/7 operational support</li><li>Customer-facing business systems</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">💍</span>Jewelry & Fashion Retail</h3><ul><li>Jewelry retail</li><li>Fashion-store systems</li><li>Back-office processes</li><li>System migration and modernization</li></ul></article>
<article class="domainCard"><h3><span class="domainIcon">🔗</span>Software, Integrations & Business Systems</h3><ul><li>MAGIC and Oracle environments</li><li>Interfaces and integrations</li><li>Legacy-system upgrades</li><li>End-to-end business-system delivery</li></ul></article>
</div></section>'''
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('</main>', section + '</main>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit English sync
        run: |
          git config user.name "portfolio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history-en.html
          git commit -m "Add The worlds I bring section to English experience" || exit 0
          git push
