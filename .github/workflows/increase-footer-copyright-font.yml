name: Increase footer copyright font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase copyright readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/style.css')
          s = p.read_text(encoding='utf-8')
          marker = 'footer-copyright-readable-v1'
          if marker not in s:
              s += '\n/* footer-copyright-readable-v1 */\nfooter::after{font-size:18px!important;font-weight:700!important;line-height:1.6!important;color:#d7e0e9!important;}\n@media(max-width:620px){footer::after{font-size:16px!important;}}\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "portfolio-style-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Increase footer copyright text readability"
          git push
