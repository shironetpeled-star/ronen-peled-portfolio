name: Sync English experience worlds v2
on: [push]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update English experience
        run: python -c "from pathlib import Path; import base64; p=Path('history-en.html'); s=p.read_text(encoding='utf-8'); marker='english-experience-worlds-v1'; css=base64.b64decode('').decode(); sec=base64.b64decode('').decode(); s=s if marker in s else s.replace('</head>',css+'</head>',1).replace('</main>',sec+'</main>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "portfolio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history-en.html
          git commit -m "Sync English experience business domains" || exit 0
          git push
