name: Fix experience bottom navigation conflict

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix experience bottom navigation conflict through project workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix quick navigation race
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/quick-nav.js')
          s = p.read_text(encoding='utf-8')
          old = "if(!nav||nav.dataset.rebuilt==='1')return;"
          new = "if(!nav)return; if(nav.dataset.rebuilt==='1' && nav.querySelector('#experienceBottomNav'))return;"
          if old in s:
              s = s.replace(old, new, 1)
          marker = "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();\n  setTimeout(run,250);setTimeout(run,1000);"
          replacement = "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();\n  setTimeout(run,250);setTimeout(run,1000);\n  if(page==='experience.html')setInterval(ensureExperience,500);"
          if marker in s and "setInterval(ensureExperience,500)" not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/quick-nav.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix experience bottom navigation conflict"
          git push