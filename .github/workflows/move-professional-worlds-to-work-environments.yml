name: Move professional worlds to Work Environments
on:
  push:
    paths:
      - '.github/workflows/move-professional-worlds-to-work-environments.yml'
permissions:
  contents: write
jobs:
  move-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove professional worlds section from homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<section class="page rdSection"><div class="rdSectionHead"><span>MY PROFESSIONAL WORLDS</span>.*?</div></section>\n(?=<section class="page rdSection"><div class="rdSplit">)'
          new, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected to remove one professional worlds section, removed {n}')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move professional worlds section to Work Environments' || exit 0
          git push
