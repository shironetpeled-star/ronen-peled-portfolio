name: Apply site patches

on:
  push:
    branches: [main]
    paths:
      - 'site-patches/**'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded patches
        run: python scripts/apply_site_patches.py
      - name: Commit generated site changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "site-patch-bot"
          git config user.email "site-patch-bot@users.noreply.github.com"
          git add experience.html military.html
          git commit -m "Apply centralized quick navigation to site pages"
          git push
