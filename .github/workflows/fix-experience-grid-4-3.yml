name: Fix experience grid 4+3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-grid:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 4 top 3 bottom grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experience.html')
          s = p.read_text(encoding='utf-8')
          marker = 'experience-grid-4-3-v1'
          if marker not in s:
              css = '''<style id="experience-grid-4-3-v1">
@media (min-width:1181px){
  .domainsGrid{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:16px!important;}
  .domainsGrid>.domainCard{grid-column:span 2!important;}
  .domainsGrid>.domainCard:nth-child(5){grid-column:2 / span 2!important;}
}
</style>'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "portfolio-layout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experience.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix experience worlds layout to 4 plus 3"
          git push
