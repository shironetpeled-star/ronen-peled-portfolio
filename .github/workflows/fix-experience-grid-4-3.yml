name: Fix experience grid 4x3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix_grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update experience layout
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('experience.html'); s=p.read_text(encoding='utf-8'); css='<style id=\"experience-grid-4-3-v1\">@media (min-width:1181px){.domainsGrid{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:16px!important}.domainsGrid>.domainCard{grid-column:span 2!important}.domainsGrid>.domainCard:nth-child(5){grid-column:2 / span 2!important}}</style>'; p.write_text(s if 'experience-grid-4-3-v1' in s else s.replace('</head>',css+'</head>',1),encoding='utf-8')"
      - name: Commit
        shell: bash
        run: |
          git config user.name portfolio-layout-bot
          git config user.email actions@users.noreply.github.com
          git add experience.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix experience worlds layout to 4 top 3 bottom"
          git push
