name: Apply High School Education Entry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-high-school-education.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add high school education card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('education.html')
          s = p.read_text(encoding='utf-8')
          marker = '</article></div></section><section class="page section"><div class="languagesHeading">'
          card = '''</article><article class="skill"><div class="titleWithIcon"><span class="sectionIcon">🏫</span><h3>תיכון — בגרות מלאה, מגמת שיווק</h3></div><span class="credentialType">סוג התעודה: בגרות מלאה</span><p><strong>מקום לימודים:</strong> תיכון תל״מ של המכללה למינהל</p><p><strong>מגמה:</strong> שיווק</p><ul class="credentialList"><li><strong>תעודה:</strong> תעודת בגרות מלאה</li><li><strong>הסמכה:</strong> תעודת משווק מורשה מטעם משרד העבודה</li><li><strong>הישג:</strong> הצטיינות בפרויקט הגמר</li></ul></article></div></section><section class="page section"><div class="languagesHeading">'''
          if 'תיכון — בגרות מלאה, מגמת שיווק' not in s:
              if marker not in s:
                  raise SystemExit('marker not found')
              s = s.replace(marker, card, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-high-school-education.yml
          git add education.html
          git commit -m "Add high school marketing education"
          git push
