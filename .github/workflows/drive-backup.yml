name: Drive Backup Artifact
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronen-peled-portfolio-backup
          path: .
          include-hidden-files: true
          retention-days: 7
