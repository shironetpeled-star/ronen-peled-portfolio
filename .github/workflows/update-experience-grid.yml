name: Update experience grid
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-experience-grid.py'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update-experience-grid.py
      - name: Commit changes
        run: |
          git config user.name 'portfolio-layout-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experience.html
          git diff --cached --quiet || git commit -m 'Arrange experience worlds as 4 plus 3 grid'
          git push
