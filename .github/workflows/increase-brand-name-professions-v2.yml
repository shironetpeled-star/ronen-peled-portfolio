name: Increase header name and professions fonts v2
on:
  push:
    paths:
      - '.github/workflows/increase-brand-name-professions-v2.yml'
permissions:
  contents: write
jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase brand typography
        run: |
          cat >> assets/style.css <<'EOF'

/* Improve header name and professions readability */
.brand b{font-size:20px!important;line-height:1.15!important}
.brand small{font-size:12px!important;line-height:1.3!important;font-weight:700}
html[lang="he"] .brand small::after{font-size:12px!important;line-height:1.3!important}
@media(max-width:950px){
  .brand b{font-size:19px!important}
  .brand small{font-size:11.5px!important;line-height:1.3!important}
  html[lang="he"] .brand small::after{font-size:11.5px!important;line-height:1.3!important}
}
EOF
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/style.css
          git commit -m "Increase header name and professions font sizes" || exit 0
          git push
