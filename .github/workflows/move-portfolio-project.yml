name: Move portfolio project to Projects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-portfolio-project.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move project card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          edu = Path('education.html')
          projects = Path('projects.html')
          e = edu.read_text(encoding='utf-8')
          p = projects.read_text(encoding='utf-8')
          title = 'הקמת אתר פורטפוליו מקצועי ובוט חכם למגייסים'
          title_pos = e.find(title)
          if title_pos < 0:
              raise SystemExit('Project not found in education.html')
          starts = [m.start() for m in re.finditer(r'<article class="skill">', e[:title_pos])]
          start = starts[-1]
          end = e.find('</article>', title_pos) + len('</article>')
          if end < len('</article>'):
              raise SystemExit('Project article end not found')
          e = e[:start] + e[end:]
          card = '''<article class="skill"><h3>🧠 הקמת אתר פורטפוליו מקצועי ובוט חכם למגייסים</h3><p><b>תחום:</b> ניהול מוצר, אפיון מערכות, UX/UI, פיתוח, בינה מלאכותית והטמעה.</p><p>תכנון, אפיון והקמה מאפס של אתר פורטפוליו מקצועי אינטראקטיבי, המציג בצורה ברורה ומובנית יותר מ־15 שנות ניסיון ואת הערך שאני יכול להביא לארגונים ולתפקידים שונים.</p><b>פרויקט End-to-End: משלב הרעיון ועד העלייה לאוויר.</b><details class="workDetails"><summary>הרחב לפירוט</summary><ul><li><b>הובלת הפרויקט:</b> הגדרת מטרות האתר וקהל היעד, ארכיטקטורת מידע, כתיבת וארגון תוכן, UX/UI, פיתוח, בדיקות, פרסום ותחזוקה שוטפת.</li><li><b>חמישה עולמות מקצועיים:</b> מנהל מוצר, מנהל פרויקט, מנתח מערכות, מתכנת Magic ו-Customer Success — עם דף נחיתה ייעודי לכל עולם מקצועי.</li><li><b>ראיית 360°:</b> חיבור בין צורכי הלקוח, יעדים עסקיים, דרישות מערכת, פיתוח, ניהול התהליך, הטמעה והתוצאה בפועל.</li><li><b>בוט חכם ואישי למגייסים:</b> מידע מדויק וממוקד על הניסיון המקצועי שלי ועל מידת ההתאמה לתפקיד או לארגון, בכתב או בקול.</li><li><b>מקורות הידע:</b> תוכן האתר, קורות חיים כלליים ומותאמים, מכתבי הסבר, מקומות עבודה, תפקידים, פרויקטים, ניסיון, יכולות, השכלה, הסמכות ומסמכים מקצועיים נוספים.</li><li><b>שאלות בשפה חופשית:</b> על ניסיון, יכולות, פרויקטים, סוגי מערכות, ענפים והערך שאני יכול להביא לתפקיד מסוים.</li><li><b>שתי רמות מידע:</b> תמצית קצרה וממוקדת או תשובה מורחבת ומפורטת.</li><li><b>ניווט חכם:</b> הפניות לעמודים ואזורים רלוונטיים באתר לפי ניסיון, פרויקטים, יכולות, השכלה, סוגי מערכות, ענפים ויתרונות מקצועיים.</li><li><b>יכולות נוספות:</b> היסטוריה של עשר השאלות האחרונות, שאלות המשך, העלאת קורות חיים או מסמך רלוונטי, התאמת עומק התשובה וניווט ישיר למידע המורחב.</li><li><b>תוכן האתר:</b> ניסיון מקצועי, עבודות ופרויקטים, סוגי מערכות וסביבות עבודה, ענפים, יכולות וכלים, השכלה והסמכות, שירות צבאי והתנדבות, קורות חיים ויצירת קשר, בעברית ובאנגלית.</li><li><b>הערך שנוצר:</b> הפיכת מידע מקצועי נרחב ומורכב למערכת דיגיטלית חכמה, ברורה ונגישה, שמאפשרת למגייס לשאול שאלה ולקבל תשובה מותאמת ומבוססת מידע.</li><li><b>מה הפרויקט מדגים:</b> זיהוי צורך, הגדרת פתרון, אפיון UX ומערכת, איחוד מקורות מידע, שילוב AI והובלת מוצר דיגיטלי מלא מהרעיון ועד מערכת פעילה.</li></ul></details></article>'''
          marker = '<div class="skillGrid">'
          idx = p.find(marker)
          if idx < 0:
              raise SystemExit('skillGrid not found')
          idx += len(marker)
          if title not in p:
              p = p[:idx] + card + p[idx:]
          edu.write_text(e, encoding='utf-8')
          projects.write_text(p, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add education.html projects.html
          git commit -m "Move portfolio AI bot project to selected projects" || exit 0
          git push
