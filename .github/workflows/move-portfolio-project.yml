name: Move portfolio project to Projects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-portfolio-project.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move project card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          edu = Path('education.html')
          projects = Path('projects.html')
          e = edu.read_text(encoding='utf-8')
          p = projects.read_text(encoding='utf-8')

          title = 'הקמת אתר פורטפוליו מקצועי ובוט חכם למגייסים'
          # Remove the project article from Education.
          start = e.find('<article class="skill">', e.find(title) - 500)
          if start < 0:
              raise SystemExit('Project article start not found in education.html')
          pos = start
          depth = 0
          end = None
          token_re = re.compile(r'<article\b|</article>')
          for m in token_re.finditer(e, start):
              if m.group(0).startswith('<article'):
                  depth += 1
              else:
                  depth -= 1
                  if depth == 0:
                      end = m.end()
                      break
          if end is None or title not in e[start:end]:
              raise SystemExit('Project article boundaries not found')
          e = e[:start] + e[end:]

          # Add a Projects-style card as the first selected project.
          card = '''<article class="skill"><h3>🧠 הקמת אתר פורטפוליו מקצועי ובוט חכם למגייסים</h3><p><b>תחום:</b> ניהול מוצר, אפיון מערכות, UX/UI, פיתוח, בינה מלאכותית והטמעה.</p><p>תכנון, אפיון והקמה מאפס של אתר פורטפוליו מקצועי אינטראקטיבי, המציג בצורה ברורה ומובנית יותר מ־15 שנות ניסיון ואת הערך שאני יכול להביא לארגונים ולתפקידים שונים.</p><b>פרויקט End-to-End: משלב הרעיון ועד העלייה לאוויר.</b><details class="workDetails"><summary>הרחב לפירוט</summary><ul><li><b>הובלת הפרויקט:</b> הגדרת מטרות האתר וקהל היעד, ארכיטקטורת מידע, כתיבת וארגון תוכן, UX/UI, פיתוח, בדיקות, פרסום ותחזוקה שוטפת.</li><li><b>חמישה עולמות מקצועיים:</b> מנהל מוצר, מנהל פרויקט, מנתח מערכות, מתכנת Magic ו-Customer Success — עם דף נחיתה ייעודי לכל עולם מקצועי.</li><li><b>ראיית 360°:</b> חיבור בין צורכי הלקוח, יעדים עסקיים, דרישות מערכת, פיתוח, ניהול התהליך, הטמעה והתוצאה בפועל.</li><li><b>בוט חכם ואישי למגייסים:</b> מאפשר לקבל מידע מדויק וממוקד על הניסיון המקצועי שלי ועל מידת ההתאמה לתפקיד או לארגון, בכתב או באמצעות קול.</li><li><b>מקורות הידע של הבוט:</b> תוכן האתר, קורות חיים כלליים ומותאמים לתפקידים ולענפים, מכתבי הסבר, מידע על מקומות עבודה ופרויקטים, מסמכי ניסיון, יכולות, השכלה והסמכות ומסמכים מקצועיים נוספים.</li><li><b>שאלות בשפה חופשית:</b> על ניסיון, יכולות מקצועיות, פרויקטים, סוגי מערכות, ענפים והערך שאני יכול להביא לתפקיד מסוים.</li><li><b>שתי רמות מידע:</b> תמצית קצרה וממוקדת או הרחבת התשובה לקבלת מידע מפורט יותר.</li><li><b>ניווט חכם:</b> בסיום כל תשובה מוצגים עמודים ואזורים רלוונטיים באתר להעמקה, לפי קטגוריות כגון ניסיון, פרויקטים, יכולות, השכלה, סוגי מערכות, ענפים ויתרונות מקצועיים.</li><li><b>יכולות נוספות:</b> היסטוריה של עשר השאלות האחרונות, שאלות המשך, העלאת קובץ קורות חיים או מסמך רלוונטי, התאמת עומק התשובה וניווט ישיר למידע המורחב באתר.</li><li><b>תוכן האתר:</b> ניסיון מקצועי, ציר התפתחות תעסוקתי, עבודות ופרויקטים, סוגי מערכות וסביבות עבודה, ענפים, יכולות וכלים טכנולוגיים, השכלה והסמכות, שירות צבאי והתנדבות, קורות חיים ויצירת קשר, בעברית ובאנגלית.</li><li><b>הערך שנוצר:</b> הפיכת מידע מקצועי נרחב ומורכב למערכת דיגיטלית חכמה, ברורה ונגישה, שמאפשרת למגייס לשאול שאלה ולקבל תשובה מותאמת ומבוססת מידע במקום לעבור ידנית על עמודים ומסמכים רבים.</li><li><b>מה הפרויקט מדגים:</b> יכולת לזהות צורך, להגדיר פתרון, לאפיין חוויית משתמש ומערכת, לאחד מקורות מידע, לשלב AI ולהוביל מוצר דיגיטלי מלא מהרעיון ועד מערכת פעילה המספקת ערך למשתמש.</li></ul></details></article>'''
          marker = '<div class="skillGrid">'
          if title not in p:
              idx = p.find(marker)
              if idx < 0:
                  raise SystemExit('skillGrid not found in projects.html')
              idx += len(marker)
              p = p[:idx] + card + p[idx:]

          edu.write_text(e, encoding='utf-8')
          projects.write_text(p, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add education.html projects.html
          git commit -m "Move portfolio AI bot project to selected projects" || exit 0
          git push
